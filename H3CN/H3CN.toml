# H3CN插件配置文件
# 特别提醒，务必保证该文件为UTF8无BOM编码

# 通用配置
[General]
TextColor = true # 兼容SoD_SP的彩色字体插件

# 用于调整弹出框的参数
# 总之词越宽弹出框越宽，游戏内小型汉字提示框默认256
# 设置相同则固定弹出框大小
[MessageBox]
BoxWidthMin    = 400    # 用于调大最小弹出提示框宽度(大于256生效, -1:保持最大)
BoxWidthMax    = -1     # 用于限制最大弹出提示框宽度(大于256生效, 最大: 游戏分辨率宽度, -1:保持最大)

# 字体映射定义
# Name: H3字体名称（切勿修改）
# ExtFont: 系统字体名（如 "SimSun", "Microsoft YaHei", "LiSu"）
# Height: 字形渲染缓冲区高度（像素）
# Width: 字形渲染缓冲区宽度（像素）
# Bold: 是否加粗（true = FW_BOLD, false = FW_NORMAL）
# AntiAlias: 是否启用抗锯齿（true = ClearType, false = 默认光栅化）
# MarginLeft: 左边距（像素）
# MarginRight: 右边距（像素）
# MarginBottom: 底部扩展（像素），扩大学形缓冲区以容纳字体下降部分（如微软雅黑需要适当增大）
# LineSpacing: 行间距（像素），增加行与行之间的额外空白
# DrawShadow: 是否绘制阴影
# OriginalAscii: 是否使用原版 ASCII 位图字体
#   true  = ASCII 字符（0x20-0x7E，含空格/英文/数字/标点）沿用游戏 .fnt 自带的
#           位图字形与间距，仅 GBK 汉字使用系统字体渲染
#   false = 全部字符（包括 ASCII）都用 ExtFont 指定的系统字体渲染

[[Fonts]]
Name = "tiny.fnt"
ExtFont = "SimSun"
Height = 12
Width = 12
Bold = false
AntiAlias = false
MarginLeft = 1
MarginRight = 0
MarginBottom = 0
LineSpacing = 0
DrawShadow = false
OriginalAscii = true

[[Fonts]]
Name = "smalfont.fnt"
